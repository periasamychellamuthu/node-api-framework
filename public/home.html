<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Versatile Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: #0f0f1a;
            color: #e0e0e0;
        }
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 32px;
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .topbar .logo {
            font-size: 20px; font-weight: 700;
            background: linear-gradient(90deg, #a78bfa, #818cf8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .topbar .user-info {
            display: flex; align-items: center; gap: 16px; font-size: 14px; color: #9ca3af;
        }
        .topbar .btn-logout {
            padding: 8px 18px; background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3);
            border-radius: 8px; color: #fca5a5; font-size: 13px; font-weight: 500; cursor: pointer;
            transition: background 0.2s;
        }
        .topbar .btn-logout:hover { background: rgba(239,68,68,0.25); }
        .container { max-width: 900px; margin: 0 auto; padding: 48px 32px; }
        .welcome-card {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px; padding: 32px; margin-bottom: 32px;
        }
        .welcome-card h2 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
        .welcome-card p { font-size: 14px; color: #9ca3af; }
        .tenant-badge {
            display: inline-block; margin-top: 12px; padding: 6px 14px;
            background: rgba(129,140,248,0.12); border: 1px solid rgba(129,140,248,0.25);
            border-radius: 20px; font-size: 13px; color: #a78bfa; font-weight: 500;
        }
        .no-tenant-card {
            background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.2);
            border-radius: 16px; padding: 32px; text-align: center;
        }
        .no-tenant-card h3 { font-size: 18px; color: #fbbf24; margin-bottom: 8px; }
        .no-tenant-card p { font-size: 14px; color: #9ca3af; margin-bottom: 20px; }
        .btn-create {
            display: inline-block; padding: 12px 28px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            border: none; border-radius: 10px; color: #111827;
            font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none;
            transition: transform 0.15s, box-shadow 0.2s;
        }
        .btn-create:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(251,191,36,0.3); }
        .api-card {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px; padding: 20px 24px; margin-bottom: 12px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .api-card .method {
            display: inline-block; padding: 4px 10px; border-radius: 6px;
            font-size: 12px; font-weight: 600; letter-spacing: 0.5px; margin-right: 12px;
        }
        .api-card .method.get { background: rgba(52,211,153,0.15); color: #34d399; }
        .api-card .method.post { background: rgba(129,140,248,0.15); color: #818cf8; }
        .api-card .path { font-size: 14px; font-family: monospace; color: #d1d5db; }
        h3.section-title { font-size: 16px; font-weight: 600; color: #9ca3af; margin: 32px 0 16px; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="logo">Versatile Platform</div>
        <div class="user-info">
            <span id="userDisplay"></span>
            <button class="btn-logout" id="logoutBtn">Logout</button>
        </div>
    </div>

    <div class="container">
        <div class="welcome-card">
            <h2 id="welcomeHeading">Welcome</h2>
            <p id="welcomeSubtext">Loading...</p>
            <span class="tenant-badge" id="tenantBadge" style="display:none;"></span>
        </div>

        <div class="no-tenant-card" id="noTenantCard" style="display:none;">
            <h3>No Organization Found</h3>
            <p>You don't belong to any tenant yet. Create your organization to get started.</p>
            <a href="/create-tenant" class="btn-create">Create Organization</a>
        </div>

        <div id="apiSection" style="display:none;">
            <h3 class="section-title">Available API Endpoints</h3>
            <div class="api-card">
                <div><span class="method get">GET</span><span class="path">/api/v1/users</span></div>
            </div>
            <div class="api-card">
                <div><span class="method post">POST</span><span class="path">/api/v1/users</span></div>
            </div>
            <div class="api-card">
                <div><span class="method get">GET</span><span class="path">/api/v1/tenants</span></div>
            </div>
            <div class="api-card">
                <div><span class="method post">POST</span><span class="path">/api/v1/tenants</span></div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('access_token');
        if (!token) {
            window.location.href = '/login';
        }

        const account = JSON.parse(localStorage.getItem('account') || '{}');
        document.getElementById('userDisplay').textContent = account.email || '';
        document.getElementById('welcomeHeading').textContent = `Welcome, ${account.display_name || 'User'}`;

        if (account.tenant_id) {
            document.getElementById('welcomeSubtext').textContent = 'Your organization is active.';
            document.getElementById('tenantBadge').textContent = `Tenant ID: ${account.tenant_id}`;
            document.getElementById('tenantBadge').style.display = 'inline-block';
            document.getElementById('apiSection').style.display = 'block';
        } else {
            document.getElementById('welcomeSubtext').textContent = 'Get started by creating your organization.';
            document.getElementById('noTenantCard').style.display = 'block';
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            localStorage.removeItem('account');
            // Server-side route clears HttpOnly cookies and redirects to /login
            window.location.href = '/auth/logout';
        });
    </script>
</body>
</html>
