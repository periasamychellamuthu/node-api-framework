<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Organization — Versatile Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0e0e0;
        }
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 48px 40px;
            width: 100%; max-width: 480px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }
        .card h1 {
            font-size: 26px; font-weight: 700; margin-bottom: 8px;
            background: linear-gradient(90deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .card p.subtitle { font-size: 14px; color: #9ca3af; margin-bottom: 32px; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block; font-size: 13px; font-weight: 500; color: #9ca3af;
            margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%; padding: 12px 16px;
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px; color: #f0f0f0; font-size: 15px; font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s; outline: none;
        }
        .form-group input:focus { border-color: #fbbf24; box-shadow: 0 0 0 3px rgba(251,191,36,0.15); }
        .form-group input::placeholder { color: #6b7280; }
        .form-group .hint { font-size: 11px; color: #6b7280; margin-top: 4px; }
        .btn-primary {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            border: none; border-radius: 10px; color: #111827;
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s; margin-top: 8px;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(251,191,36,0.3); }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .error-msg {
            background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
            color: #fca5a5; padding: 12px 16px; border-radius: 10px;
            font-size: 13px; margin-bottom: 20px; display: none;
        }
        .success-msg {
            background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.3);
            color: #6ee7b7; padding: 12px 16px; border-radius: 10px;
            font-size: 13px; margin-bottom: 20px; display: none;
        }
        .logout-link { text-align: center; margin-top: 24px; font-size: 13px; color: #6b7280; }
        .logout-link a { color: #9ca3af; text-decoration: none; }
        .logout-link a:hover { color: #fca5a5; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Create Organization</h1>
        <p class="subtitle">Set up your workspace to start using Versatile Platform</p>

        <div class="error-msg"  id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>

        <form id="orgForm">
            <div class="form-group">
                <label for="name">Organization Name</label>
                <input type="text" id="name" placeholder="e.g. Acme Corporation" required autocomplete="organization">
            </div>
            <div class="form-group">
                <label for="org_handle">Organization Handle</label>
                <input type="text" id="org_handle" placeholder="e.g. acme-corp" required
                       pattern="[a-z0-9][a-z0-9\-]{1,48}[a-z0-9]|[a-z0-9]{3,50}"
                       autocomplete="off">
                <div class="hint">3–50 characters · lowercase letters, numbers and hyphens only · no leading/trailing hyphens</div>
            </div>
            <div class="form-group">
                <label for="domain">Domain <span style="font-weight:400;text-transform:none;">(optional)</span></label>
                <input type="text" id="domain" placeholder="e.g. acme.com" autocomplete="off">
            </div>
            <button type="submit" class="btn-primary" id="submitBtn">Create Organization</button>
        </form>

        <div class="logout-link">
            Wrong account? <a href="/auth/logout">Sign out</a>
        </div>
    </div>

    <script>
        const form       = document.getElementById('orgForm');
        const errorMsg   = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const submitBtn  = document.getElementById('submitBtn');

        // Auto-generate org_handle from name as the user types
        document.getElementById('name').addEventListener('input', (e) => {
            const handleField = document.getElementById('org_handle');
            // Only auto-fill if the user hasn't manually edited the handle yet
            if (!handleField.dataset.manual) {
                handleField.value = e.target.value
                    .toLowerCase()
                    .replace(/[^a-z0-9]+/g, '-')
                    .replace(/^-+|-+$/g, '')
                    .substring(0, 50);
            }
        });
        document.getElementById('org_handle').addEventListener('input', (e) => {
            // Once the user types in the handle field directly, stop auto-filling
            e.target.dataset.manual = 'true';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display  = 'none';
            successMsg.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating...';

            const name       = document.getElementById('name').value.trim();
            const org_handle = document.getElementById('org_handle').value.trim().toLowerCase();
            const domain     = document.getElementById('domain').value.trim() || undefined;

            try {
                // POST /api/v1/orgs
                // Payload: { input_data: { org: { name, org_handle, domain? } } }
                // Auth: carried via iam_adt HttpOnly cookie (set at signup/login)
                const resp = await fetch('/api/v1/orgs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        input_data: {
                            org: { name, org_handle, ...(domain ? { domain } : {}) }
                        }
                    })
                });

                const data = await resp.json();

                if (resp.ok && data.response_status?.status === 'success') {
                    // Store org + membership info for dashboard display
                    const account = JSON.parse(localStorage.getItem('account') || '{}');
                    account.org_id     = data.org?.org_id;
                    account.org_handle = data.org?.org_handle;
                    account.member_id  = data.membership?.member_id;
                    account.role       = data.membership?.role;
                    localStorage.setItem('account', JSON.stringify(account));

                    successMsg.textContent = `Organization "${data.org?.name}" created! Redirecting to your dashboard...`;
                    successMsg.style.display = 'block';
                    setTimeout(() => { window.location.href = '/'; }, 1200);
                } else {
                    errorMsg.textContent = data.response_status?.message || 'Organization creation failed. Please try again.';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Network error. Please try again.';
                errorMsg.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Organization';
            }
        });
    </script>
</body>
</html>
